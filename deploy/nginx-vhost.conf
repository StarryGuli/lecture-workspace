# ── 记录工作台 · 同步仓库 ──
# 只转发到本机 127.0.0.1:8791 的 lecture-sync（加密黑盒存储，不是应用本体）。
# 请求体上限 10m：单份会话分析结果远小于此，录音不会来这里。
server {
    listen 127.0.0.1:8445 ssl http2 proxy_protocol;
    server_name lecture.example.com;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/nginx/ssl/lecture-example.crt;
    ssl_certificate_key /etc/nginx/ssl/lecture-example.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60;
        proxy_send_timeout 60;
    }
}
